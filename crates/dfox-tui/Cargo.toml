[package]
name = "dfox-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dfox-core = { path = "../dfox-core" }
dfox-sql = { path = "../dfox-sql" }
dfox-ssh = { path = "../dfox-ssh" }
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
dfox-driver-postgres = { path = "../dfox-driver-postgres", optional = true }
dfox-driver-mysql = { path = "../dfox-driver-mysql", optional = true }
dfox-driver-sqlite = { path = "../dfox-driver-sqlite", optional = true }
dfox-driver-mongo = { path = "../dfox-driver-mongo", optional = true }
dfox-driver-cassandra = { path = "../dfox-driver-cassandra", optional = true }
tokio = { version = "1.40.0", features = ["full"] }
futures-util = { version = "0.3.31", default-features = false }
arboard = "3.3.0"
log = "0.4.21"
env_logger = "0.11.3"
dotenvy = "0.15.7"
serde = { version = "1.0.209", features = ["derive"] }
toml = "1.1.8"
directories = "6.0.0"
throbber-widgets-tui = "0.11.1"
keyring = "4.2.0"
tui-tree-widget = "0.24.1"
nucleo-matcher = "0.3.1"
url = "2.5.8"
percent-encoding = "2.3.2"
serde_json = "1"
unicode-width = "0.2.2"
tachyonfx = "0.25.2"
tui-big-text = "0.8.10"
mimalloc = "0.1.52"

[features]
# Each database is a driver crate; build with fewer for a smaller binary, for
# example `--no-default-features --features sqlite`.
default = ["postgres", "mysql", "sqlite", "mongo", "cassandra"]
postgres = ["dep:dfox-driver-postgres"]
mysql = ["dep:dfox-driver-mysql"]
sqlite = ["dep:dfox-driver-sqlite"]
mongo = ["dep:dfox-driver-mongo"]
cassandra = ["dep:dfox-driver-cassandra"]

[dev-dependencies]
insta = "1.49.0"


[lints]
workspace = true
