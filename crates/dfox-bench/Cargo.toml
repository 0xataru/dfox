[package]
name = "dfox-bench"
description = "dfox benchmarks: decoding, memory and drawing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
dfox-core = { path = "../dfox-core" }
dfox-driver-mysql = { path = "../dfox-driver-mysql" }
dfox-driver-postgres = { path = "../dfox-driver-postgres" }
dfox-driver-sqlite = { path = "../dfox-driver-sqlite" }
dfox-tui = { path = "../dfox-tui", default-features = false }
ratatui = "0.30.2"
tokio = { version = "1.40.0", features = ["full"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# The library holds shared data, not benchmarks; leaving it out keeps
# criterion's options away from the test harness.
[lib]
bench = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "memory"
harness = false

[lints]
workspace = true
