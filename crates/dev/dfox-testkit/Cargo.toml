[package]
name = "dfox-testkit"
description = "Test helpers for dfox drivers, and tests of the engine over every driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
dfox-core = { path = "../../core/dfox-core" }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
tokio = { version = "1.40.0", features = ["full"] }

[dev-dependencies]
dfox = { path = "../../ui/dfox-tui" }
dfox-driver-mongo = { path = "../../drivers/dfox-driver-mongo" }
dfox-driver-mysql = { path = "../../drivers/dfox-driver-mysql" }
dfox-driver-postgres = { path = "../../drivers/dfox-driver-postgres" }
dfox-driver-sqlite = { path = "../../drivers/dfox-driver-sqlite" }

[lints]
workspace = true
