[package]
name = "dfox-driver-mongo"
description = "MongoDB driver for dfox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dfox-core = { path = "../../core/dfox-core" }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
log = "0.4.21"
tokio = { version = "1.40.0", features = ["full"] }
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
serde_json = "1"
bson = { version = "3.1.0", features = ["serde_json-1"] }

[dev-dependencies]
dfox-testkit = { path = "../../dev/dfox-testkit" }

[lints]
workspace = true
