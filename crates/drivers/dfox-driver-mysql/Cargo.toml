[package]
name = "dfox-driver-mysql"
description = "MySQL driver for dfox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dfox-core = { path = "../../core/dfox-core" }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
log = "0.4.21"
tokio = { version = "1.40.0", features = ["full"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
dfox-sql = { path = "../../libs/dfox-sql" }
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
rustls-native-certs = "0.8.5"
serde_json = "1"
base64 = "0.22.1"

[dev-dependencies]
dfox-testkit = { path = "../../dev/dfox-testkit" }

[lints]
workspace = true
