[workspace]
members = ["dfox-core", "dfox-tui"]
resolver = "2"

# One version for the whole workspace, bumped by `make bump`.
[workspace.package]
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/0xataru/dfox"

# Application code returns errors instead of panicking. Tests may still unwrap
# (see clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
