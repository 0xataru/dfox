# Databases for the integration tests (`make test-it`).
# Ports are offset so they don't clash with servers already running locally.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dfox
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dfox
      MYSQL_DATABASE: dfox
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdfox"]
      interval: 2s
      retries: 60
