# Databases for the integration tests (`make test-it`).
# Ports are offset so they don't clash with servers already running locally.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dfox
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dfox
      MYSQL_DATABASE: dfox
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdfox"]
      interval: 2s
      retries: 60

  mongo:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dfox
    ports: ["57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  scylla:
    image: scylladb/scylla:2025.1
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --authenticator PasswordAuthenticator
    ports: ["59042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT now() FROM system.local'"]
      interval: 5s
      retries: 60

  valkey:
    image: valkey/valkey:8.1
    command: --requirepass dfox
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "dfox", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 30
