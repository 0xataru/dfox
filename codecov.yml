# Coverage is reported, never enforced: a drop should start a conversation in
# the PR comment rather than block the merge. Core and TUI are reported as
# separate components, since the TUI has few tests until its redesign.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

component_management:
  individual_components:
    - component_id: core
      name: dfox-core
      paths:
        - dfox-core/**
    - component_id: tui
      name: dfox-tui
      paths:
        - dfox-tui/**

comment:
  layout: "diff, components, files"
  require_changes: true
