# Coverage is reported for main, never enforced. Each part of the workspace is
# its own component.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

component_management:
  individual_components:
    - component_id: core
      name: dfox-core
      paths:
        - crates/core/dfox-core/**
    - component_id: drivers
      name: drivers
      paths:
        - crates/drivers/dfox-driver-*/**
    - component_id: sql
      name: dfox-sql
      paths:
        - crates/libs/dfox-sql/**
    - component_id: tui
      name: dfox-tui
      paths:
        - crates/ui/dfox-tui/**

