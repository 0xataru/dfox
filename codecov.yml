# Coverage is reported, never enforced: a drop should start a conversation in
# the PR comment rather than block the merge. Each part of the workspace is its
# own component.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

component_management:
  individual_components:
    - component_id: core
      name: dfox-core
      paths:
        - crates/dfox-core/**
    - component_id: drivers
      name: drivers
      paths:
        - crates/dfox-driver-*/**
    - component_id: sql
      name: dfox-sql
      paths:
        - crates/dfox-sql/**
    - component_id: tui
      name: dfox-tui
      paths:
        - crates/dfox-tui/**

comment:
  layout: "diff, components, files"
  require_changes: true
