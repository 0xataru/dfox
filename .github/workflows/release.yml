name: Release

# Runs when `make publish` pushes a vX.Y.Z tag: builds dfox-tui for each platform
# and publishes the GitHub release, with the CHANGELOG.md section as its notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail before building anything if the tag and the workspace version disagree
  # or the changelog has no section for it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./scripts/version.sh)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          ./scripts/release-notes.sh "$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --bin dfox-tui --target ${{ matrix.target }}

      - name: package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="dfox-v${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/dfox-tui.exe" "dist/$name/"
            (cd dist && 7z a -bd "$name.zip" "$name" >/dev/null)
          else
            cp "target/$TARGET/release/dfox-tui" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          ./scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
