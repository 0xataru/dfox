name: Coverage

# Measures line coverage with cargo-llvm-cov and uploads it to Codecov, which
# serves the README badge. Runs with the same database services as the
# integration job in ci.yml, so the client code is measured too. Only on main:
# pull requests already run the tests in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dfox
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dfox
          MYSQL_DATABASE: dfox
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdfox"
          --health-interval 2s --health-retries 60
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: dfox
        ports: ["57017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 2s --health-retries 60
    env:
      DFOX_IT_REQUIRED: "1"
      DFOX_TEST_CASSANDRA_URL: cassandra://cassandra:cassandra@127.0.0.1:59042
      DFOX_TEST_REDIS_URL: redis://:dfox@127.0.0.1:56379
      DFOX_TEST_MONGO_URL: mongodb://root:dfox@127.0.0.1:57017
      DFOX_TEST_POSTGRES_URL: postgres://postgres:dfox@127.0.0.1:55432/postgres
      DFOX_TEST_MYSQL_URL: mysql://root:dfox@127.0.0.1:53306/dfox
      DFOX_TEST_POSTGRES_TLS_URL: postgres://postgres:dfox@localhost:55433/postgres
      DFOX_TEST_POSTGRES_CA: ${{ github.workspace }}/target/tls/ca.pem
      DFOX_TEST_SSH_DIR: ${{ github.workspace }}/target/ssh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov

      # ScyllaDB and Valkey need arguments a service container can't take:
      # one small shard and logins, a password.
      - name: ScyllaDB and Valkey
        run: docker compose -f docker-compose.test.yml up -d --wait scylla valkey

      - name: TLS Postgres
        run: ./scripts/tls-postgres.sh

      - name: SSH jump host
        run: ./scripts/ssh-server.sh

      - name: measure
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Pull requests from forks get no secrets; Codecov accepts those uploads
      # without a token for public repositories. On main the token is required,
      # so a missing CODECOV_TOKEN secret fails loudly there.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
