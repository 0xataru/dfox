name: Homebrew formula

# Called by release.yml in place of dist's own Homebrew job: commits the
# formula dist made to 0xataru/homebrew-tap, as dist does, with a `test do`
# block added (brew style asks for one, and dist doesn't write it).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Nothing from GITHUB_TOKEN: the tap is pushed with HOMEBREW_TAP_TOKEN. The
# caller grants a publish job only id-token and packages, so asking for more,
# even `contents: read`, fails the whole release at startup.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-22.04
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases }}
    env:
      PLAN: ${{ inputs.plan }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          repository: "0xataru/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            # The test brew runs after installing: dfox starts and knows its version.
            if ! grep -q "^  test do" "Formula/${filename}"; then
              sed -i '$d' "Formula/${filename}"
              printf '\n  test do\n    assert_match version.to_s, shell_output("#{bin}/dfox version")\n  end\nend\n' >> "Formula/${filename}"
            fi

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push
