name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Each driver is a cargo feature; the app must build with any one alone.
      - name: clippy, one driver at a time
        run: |
          for driver in postgres mysql sqlite mongo cassandra redis; do
            cargo clippy -p dfox --no-default-features --features "$driver" --locked -- -D warnings
          done

      - name: guards
        run: ./scripts/guards.sh

  # Every platform the release workflow ships a binary for, so a release can
  # never be the first time a platform is built.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: test
        run: cargo test --workspace --locked

  # The driver tests against real servers. Linux only: service containers
  # need Docker, which the macOS and Windows runners don't provide.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dfox
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dfox
          MYSQL_DATABASE: dfox
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdfox"
          --health-interval 2s --health-retries 60
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: dfox
        ports: ["57017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 2s --health-retries 60
    env:
      DFOX_IT_REQUIRED: "1"
      DFOX_TEST_CASSANDRA_URL: cassandra://cassandra:cassandra@127.0.0.1:59042
      DFOX_TEST_REDIS_URL: redis://:dfox@127.0.0.1:56379
      DFOX_TEST_MONGO_URL: mongodb://root:dfox@127.0.0.1:57017
      DFOX_TEST_POSTGRES_URL: postgres://postgres:dfox@127.0.0.1:55432/postgres
      DFOX_TEST_MYSQL_URL: mysql://root:dfox@127.0.0.1:53306/dfox
      DFOX_TEST_POSTGRES_TLS_URL: postgres://postgres:dfox@localhost:55433/postgres
      DFOX_TEST_POSTGRES_CA: ${{ github.workspace }}/target/tls/ca.pem
      DFOX_TEST_SSH_DIR: ${{ github.workspace }}/target/ssh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ScyllaDB and Valkey need arguments a service container can't take:
      # one small shard and logins, a password.
      - name: ScyllaDB and Valkey
        run: docker compose -f docker-compose.test.yml up -d --wait scylla valkey

      # A second Postgres with TLS and a test CA, for the verify-full tests.
      - name: TLS Postgres
        run: ./scripts/tls-postgres.sh

      # An SSH jump host in front of the test Postgres, for the tunnel tests.
      - name: SSH jump host
        run: ./scripts/ssh-server.sh

      - name: integration tests
        run: >-
          cargo test --locked --tests
          -p dfox-driver-postgres -p dfox-driver-mysql -p dfox-driver-sqlite -p dfox-driver-mongo -p dfox-driver-cassandra -p dfox-driver-redis
          -p dfox-ssh -p dfox-testkit

  # Benchmarks of main and of the change, on the same runner one after the
  # other, so they compare fairly. Fails when a benchmark is more than 10%
  # slower even at the low end of its confidence interval.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dfox
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dfox
          MYSQL_DATABASE: dfox
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdfox"
          --health-interval 2s --health-retries 60
    env:
      DFOX_TEST_POSTGRES_URL: postgres://postgres:dfox@127.0.0.1:55432/postgres
      DFOX_TEST_MYSQL_URL: mysql://root:dfox@127.0.0.1:53306/dfox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: benchmark main
        run: |
          git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          if [ -d crates/dfox-bench ]; then
            cargo bench --locked -p dfox-bench --benches -- --save-baseline main
          else
            echo "main has no benchmarks yet"
          fi
          git checkout --quiet "${{ github.sha }}"

      - name: benchmark the change
        run: cargo bench --locked -p dfox-bench --benches -- --baseline-lenient main

      - name: compare
        run: ./scripts/bench-compare.sh

  # Known vulnerabilities in dependencies. Not required for merging: an advisory
  # can appear overnight on code that has not changed.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
